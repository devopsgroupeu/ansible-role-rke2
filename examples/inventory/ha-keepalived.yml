# HA RKE2 inventory — 3 server nodes + 2 agent nodes, VIP managed by keepalived
# Set rke2_vip_enabled: true and rke2_vip_manager: keepalived in group_vars

all:
  children:
    server_nodes:
      hosts:
        rke2-server1:
          ansible_host: 10.0.0.11
        rke2-server2:
          ansible_host: 10.0.0.12
        rke2-server3:
          ansible_host: 10.0.0.13
    agent_nodes:
      hosts:
        rke2-worker1:
          ansible_host: 10.0.0.21
        rke2-worker2:
          ansible_host: 10.0.0.22
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
