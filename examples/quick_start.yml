---
# =============================================================================
# RKE2 Quick Start Examples
# =============================================================================
# Copy the relevant example into your playbook and adjust variables.
# Full variable reference: defaults/main.yml
# =============================================================================

# -----------------------------------------------------------------------------
# Example 1: Single Node (development / testing)
# -----------------------------------------------------------------------------
# Inventory — use the ready-made examples/inventory/single-node.yml, or create
# your own equivalent:
#
#   all:
#     children:
#       server_nodes:
#         hosts:
#           rke2-server:
#             ansible_host: 10.0.0.10
#     vars:
#       ansible_user: root
#       ansible_ssh_private_key_file: ~/.ssh/id_rsa
#
# Run: ansible-playbook -i examples/inventory/single-node.yml examples/quick_start.yml

- name: Install RKE2 - single node
  hosts: all
  become: true
  vars:
    rke2_version: v1.36.1+rke2r2
    rke2_tls_san:
      - "10.0.0.10"
  roles:
    - role: devopsgroupeu.rke2

# -----------------------------------------------------------------------------
# Example 2: HA cluster (3 server nodes + worker nodes)
# -----------------------------------------------------------------------------
# Inventory — use the ready-made examples/inventory/ha-kubevip.yml (kube-vip)
# or examples/inventory/ha-keepalived.yml (keepalived), or create your own:
#
#   all:
#     children:
#       server_nodes:
#         hosts:
#           rke2-server1:
#             ansible_host: 10.0.0.11
#           rke2-server2:
#             ansible_host: 10.0.0.12
#           rke2-server3:
#             ansible_host: 10.0.0.13
#       agent_nodes:
#         hosts:
#           rke2-worker1:
#             ansible_host: 10.0.0.21
#           rke2-worker2:
#             ansible_host: 10.0.0.22
#     vars:
#       ansible_user: root
#       ansible_ssh_private_key_file: ~/.ssh/id_rsa
#
# Run (kube-vip): ansible-playbook -i examples/inventory/ha-kubevip.yml examples/quick_start.yml
# Run (keepalived): ansible-playbook -i examples/inventory/ha-keepalived.yml examples/quick_start.yml

