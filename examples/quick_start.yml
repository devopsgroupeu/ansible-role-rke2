---
# =============================================================================
# RKE2 Quick Start Examples
# =============================================================================
# Copy the relevant example into your playbook and adjust variables.
# Full variable reference: defaults/main.yml
# =============================================================================

# -----------------------------------------------------------------------------
# Example 1: Single Node (development / testing)
# -----------------------------------------------------------------------------
# Inventory (inventory/hosts.yaml):
#
#   all:
#     children:
#       server_nodes:
#         hosts:
#           rke2-server:
#             ansible_host: 10.0.0.10
#
# Run: ansible-playbook -i inventory/hosts.yaml examples/quick_start.yml

- name: Install RKE2 - single node
  hosts: all
  become: true
  vars:
    rke2_version: v1.36.1+rke2r2
    rke2_tls_san:
      - "10.0.0.10"
  roles:
    - role: ansible-role-rke2

