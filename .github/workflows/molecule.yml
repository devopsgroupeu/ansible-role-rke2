---
name: Molecule

on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule-default:
    name: molecule / default / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - ubuntu2204
          - ubuntu2404
          - rockylinux9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule default scenario
        run: molecule test -s default
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_IMAGE: "geerlingguy/docker-${{ matrix.distro }}-ansible:latest"

  molecule-ha:
    name: molecule / ha / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - ubuntu2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule HA scenario
        run: molecule test -s ha
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_IMAGE: "geerlingguy/docker-${{ matrix.distro }}-ansible:latest"

  molecule-keepalived:
    name: molecule / keepalived / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - ubuntu2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule keepalived scenario
        run: molecule test -s keepalived
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_IMAGE: "geerlingguy/docker-${{ matrix.distro }}-ansible:latest"
