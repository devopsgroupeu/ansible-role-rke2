---
# Kernel parameters for rke2_cis_profile: cis. RKE2 checks the first four on
# every start and refuses to start when they differ; root_maxbytes comes from
# the RKE2 hardening guide.
_rke2_cis_sysctls:
  vm.panic_on_oom: 0
  vm.overcommit_memory: 1
  kernel.panic: 10
  kernel.panic_on_oops: 1
  kernel.keys.root_maxbytes: 25000000

# Keys server-config.yml.j2 and agent-config.yml.j2 render themselves;
# rke2_extra_config must not repeat them (duplicate YAML keys).
_rke2_managed_config_keys:
  - token
  - server
  - agent-token
  - cni
  - tls-san
  - cluster-cidr
  - service-cidr
  - cluster-dns
  - cluster-domain
  - node-ip
  - node-external-ip
  - system-default-registry
  - etcd-disable-snapshots
  - etcd-snapshot-schedule-cron
  - etcd-snapshot-retention
  - etcd-s3
  - etcd-s3-endpoint
  - etcd-s3-bucket
  - etcd-s3-region
  - etcd-s3-folder
  - etcd-s3-access-key
  - etcd-s3-secret-key
  - etcd-s3-endpoint-ca
  - etcd-s3-skip-ssl-verify
  - node-label
  - node-taint
  - data-dir
  - write-kubeconfig-mode
  - node-name
  - debug
  - profile
  - audit-policy-file
  - disable-cloud-controller
  - cloud-provider-name
  - selinux
  - ingress-controller
  - disable
  - disable-kube-proxy
  - kube-apiserver-arg
  - kube-scheduler-arg
  - kube-controller-manager-arg
  - kubelet-arg
  - kube-proxy-arg
