---
- name: Ensure cron is installed for certificate rotation
  ansible.builtin.package:
    name: "{{ 'cronie' if ansible_facts['os_family'] == 'RedHat' else 'cron' }}"
    state: present

- name: Ensure cert rotation directory exists
  ansible.builtin.file:
    path: /etc/rancher/certs_rotation
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy certificate rotation script
  ansible.builtin.template:
    src: rotate_rke2_certs.sh.j2
    dest: /etc/rancher/certs_rotation/rotate_rke2_certs.sh
    owner: root
    group: root
    mode: "0755"

# The rotation script stops RKE2 while it rotates, so nodes must not run it at
# the same time: servers are offset by their position in server_nodes, agents
# follow after the last server. The offset wraps around midnight.
- name: Compute the staggered rotation time for this node
  vars:
    _nodes: "{{ groups['server_nodes'] | default([]) + groups['agent_nodes'] | default([]) }}"
    _index: "{{ _nodes.index(inventory_hostname) }}"
    _offset: >-
      {{ rke2_cert_rotation_schedule_hour | int * 60 + rke2_cert_rotation_schedule_minute | int
         + _index | int * rke2_cert_rotation_stagger_minutes | int }}
  ansible.builtin.set_fact:
    _rke2_cert_rotation_hour: "{{ ((_offset | int) // 60) % 24 }}"
    _rke2_cert_rotation_minute: "{{ (_offset | int) % 60 }}"

- name: Set up daily certificate rotation cron job
  ansible.builtin.cron:
    name: "Rotate RKE2 certificates"
    job: "env -i SHELL=/bin/bash PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /etc/rancher/certs_rotation/rotate_rke2_certs.sh"
    minute: "{{ _rke2_cert_rotation_minute }}"
    hour: "{{ _rke2_cert_rotation_hour }}"
    user: root
    state: present
  when: rke2_cert_rotation_schedule_type == 'daily'

- name: Set up weekly certificate rotation cron job
  ansible.builtin.cron:
    name: "Rotate RKE2 certificates"
    job: "env -i SHELL=/bin/bash PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /etc/rancher/certs_rotation/rotate_rke2_certs.sh"
    minute: "{{ _rke2_cert_rotation_minute }}"
    hour: "{{ _rke2_cert_rotation_hour }}"
    weekday: "{{ rke2_cert_rotation_schedule_day_of_week }}"
    user: root
    state: present
  when: rke2_cert_rotation_schedule_type == 'weekly'

- name: Set up monthly certificate rotation cron job
  ansible.builtin.cron:
    name: "Rotate RKE2 certificates"
    job: "env -i SHELL=/bin/bash PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /etc/rancher/certs_rotation/rotate_rke2_certs.sh"
    minute: "{{ _rke2_cert_rotation_minute }}"
    hour: "{{ _rke2_cert_rotation_hour }}"
    day: "{{ rke2_cert_rotation_schedule_day_of_month }}"
    user: root
    state: present
  when: rke2_cert_rotation_schedule_type == 'monthly'
