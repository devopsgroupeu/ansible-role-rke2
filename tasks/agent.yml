---
# The agent config now carries data-dir. An installed agent whose data still
# lives in the default directory would start with an empty rke2_data_dir
# (new node identity, no cached images), so stop before writing the config.
- name: Find agent data in the default and the configured data dir
  ansible.builtin.stat:
    path: "{{ item }}/agent"
  loop:
    - /var/lib/rancher/rke2
    - "{{ rke2_data_dir }}"
  register: _rke2_agent_data_dirs
  check_mode: false
  when:
    - _rke2_current_version != 'not_installed'
    - rke2_data_dir != '/var/lib/rancher/rke2'

- name: Refuse to move an installed agent to an empty rke2_data_dir
  ansible.builtin.assert:
    that:
      - not (_rke2_agent_data_dirs.results[0].stat.exists and not _rke2_agent_data_dirs.results[1].stat.exists)
    fail_msg: >-
      {{ inventory_hostname }} is an installed agent with its data in
      /var/lib/rancher/rke2/agent, but rke2_data_dir is {{ rke2_data_dir }} and
      {{ rke2_data_dir }}/agent does not exist. Stop rke2-agent and move
      /var/lib/rancher/rke2 to {{ rke2_data_dir }} first, or keep the default
      rke2_data_dir for this node.
    quiet: true
  when:
    - _rke2_current_version != 'not_installed'
    - rke2_data_dir != '/var/lib/rancher/rke2'

- name: Download RKE2 agent install script (internet)
  ansible.builtin.get_url:
    url: "https://get.rke2.io"
    dest: "/tmp/rke2-install.sh"
    mode: "0755"
  when:
    - not (rke2_airgapped | default(false) | bool)
    - _rke2_install_needed | bool

- name: Install or upgrade RKE2 agent (internet)
  ansible.builtin.command: sh /tmp/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel if (rke2_version | default('') | length == 0) else '' }}"
    INSTALL_RKE2_TYPE: "agent"
    INSTALL_RKE2_METHOD: "{{ rke2_install_method }}"
  changed_when: true
  notify: Restart rke2-agent
  when:
    - not (rke2_airgapped | default(false) | bool)
    - _rke2_install_needed | bool

- name: Install or upgrade RKE2 agent (air-gapped)
  ansible.builtin.command: sh /tmp/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel if (rke2_version | default('') | length == 0) else '' }}"
    INSTALL_RKE2_TYPE: "agent"
    INSTALL_RKE2_METHOD: "{{ rke2_install_method }}"
    INSTALL_RKE2_ARTIFACT_PATH: "{{ '/tmp/rke2-artifacts' if rke2_airgapped_artifacts_dir | length > 0 else '' }}"
    INSTALL_RKE2_AGENT_IMAGES_DIR: "{{ rke2_data_dir }}/agent/images"
  changed_when: true
  notify: Restart rke2-agent
  when:
    - rke2_airgapped | default(false) | bool
    - _rke2_install_needed | bool

- name: Ensure /etc/rancher/rke2 directory exists
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: "0755"

# rke2_agent_token may be scoped to server_nodes only (e.g. group_vars); the
# first server's host vars still carry it, so agents never fall back to the
# full server token by accident.
- name: Resolve the agent token
  ansible.builtin.set_fact:
    _rke2_agent_join_token: >-
      {{ rke2_agent_token if rke2_agent_token | default('') | length > 0
         else hostvars[groups['server_nodes'][0]]['rke2_agent_token'] | default('') }}
  no_log: true

- name: Resolve the cluster join token (no agent token)
  ansible.builtin.import_tasks: token.yml
  when: _rke2_agent_join_token | length == 0

- name: Generate RKE2 agent configuration
  ansible.builtin.template:
    src: agent-config.yml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart rke2-agent
  no_log: true

- name: Configure the private registries
  ansible.builtin.import_tasks: registries.yml

- name: Wait for VIP to be reachable before starting agent
  ansible.builtin.wait_for:
    host: "{{ rke2_vip_address }}"
    port: 9345
    delay: 5
    timeout: 300
    msg: "Timed out waiting for kube-vip VIP {{ rke2_vip_address }}:9345 to become reachable"
  when:
    - rke2_vip_enabled | default(false) | bool
    - rke2_vip_address | default('') | length > 0
    - rke2_agent_server_address | default('') | length == 0

- name: Enable and start RKE2 agent service
  ansible.builtin.systemd_service:
    name: rke2-agent
    state: started
    enabled: true
    daemon_reload: true
  when: not (ansible_check_mode and _rke2_install_needed | bool)
