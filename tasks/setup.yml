---
- name: Collect service facts
  ansible.builtin.service_facts:

- name: Stop and disable firewalld if installed
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - rke2_disable_firewalld | default(true) | bool
    - "'firewalld.service' in ansible_facts.services"
    - "ansible_facts.services['firewalld.service']['status'] not in ['not-found', 'masked']"

- name: Ensure required packages are installed
  ansible.builtin.package:
    name: "{{ rke2_additional_packages }}"
    state: present

- name: Set SELinux to permissive when rke2_selinux is disabled (RHEL-family)
  ansible.posix.selinux:
    policy: targeted
    state: permissive
  when:
    - ansible_facts['os_family'] == "RedHat"
    - not rke2_selinux | default(false) | bool

- name: Install container-selinux when rke2_selinux is enabled (RHEL-family)
  ansible.builtin.package:
    name: container-selinux
    state: present
  when:
    - ansible_facts['os_family'] == "RedHat"
    - rke2_selinux | default(false) | bool

- name: Assert this server node matches at most one rke2_server_nodes entry
  ansible.builtin.assert:
    that:
      - (rke2_server_nodes | selectattr('host', 'in', [inventory_hostname, ansible_host | default(inventory_hostname)]) | list) | length <= 1
    fail_msg: >-
      Multiple rke2_server_nodes entries match {{ inventory_hostname }}
      (host must equal inventory_hostname or ansible_host).
  when:
    - "'server_nodes' in group_names"
    - rke2_server_nodes | length > 0

- name: Assert this agent node matches at most one rke2_agent_nodes entry
  ansible.builtin.assert:
    that:
      - (rke2_agent_nodes | selectattr('host', 'in', [inventory_hostname, ansible_host | default(inventory_hostname)]) | list) | length <= 1
    fail_msg: >-
      Multiple rke2_agent_nodes entries match {{ inventory_hostname }}
      (host must equal inventory_hostname or ansible_host).
  when:
    - "'agent_nodes' in group_names"
    - rke2_agent_nodes | length > 0
