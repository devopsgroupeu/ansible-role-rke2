---
# ============================================================================
# GitLab CI/CD Pipeline for Ansible Role RKE2
# ============================================================================
# This pipeline runs linting and testing for the RKE2 Ansible role
# ============================================================================

stages:
  - lint
  - test
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ANSIBLE_FORCE_COLOR: "1"
  PY_COLORS: "1"

cache:
  paths:
    - .cache/pip
    - venv/

# ============================================================================
# Lint Stage
# ============================================================================

yamllint:
  stage: lint
  image: python:3.11-slim
  cache: []
  before_script:
    - pip install yamllint
  script:
    - yamllint defaults/ handlers/ tasks/ templates/ molecule/ meta/ examples/ .gitlab-ci.yml .yamllint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

ansible-lint:
  stage: lint
  image: python:3.11-slim
  cache: []
  before_script:
    - pip install ansible-lint
  script:
    - ansible-lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

# ============================================================================
# Test Stage - Molecule Tests
# ============================================================================

.molecule_test:
  stage: test
  image: python:3.11
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update && apt-get install -y docker.io
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

molecule:default:
  extends: .molecule_test
  script:
    - source venv/bin/activate
    - molecule test -s default

molecule:ha:
  extends: .molecule_test
  script:
    - source venv/bin/activate
    - molecule test -s ha

molecule:keepalived:
  extends: .molecule_test
  script:
    - source venv/bin/activate
    - molecule test -s keepalived

