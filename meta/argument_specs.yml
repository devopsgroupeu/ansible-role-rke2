---
argument_specs:
  main:
    short_description: Install and configure RKE2 Kubernetes (single-node and HA)
    description: >
      Installs RKE2 server and agent nodes, optionally configures a Virtual IP
      (kube-vip or keepalived), manages proxy settings, custom CA certificates,
      certificate rotation, and Helm addons.
    author:
      - DevOpsGroup

    options:
      # -----------------------------------------------------------------------
      # Version
      # -----------------------------------------------------------------------
      rke2_version:
        type: str
        required: false
        default: v1.36.6+rke2r2
        description: >
          RKE2 release version to install (e.g. v1.36.6+rke2r2). Takes
          precedence over rke2_channel. Leave empty to use rke2_channel.

      rke2_channel:
        type: str
        required: false
        default: ""
        description: >
          RKE2 install channel used only when rke2_version is empty. Options:
          stable, latest, or a per-minor channel like "v1.35". The role
          resolves it to the channel's latest version (from the controller,
          via rke2_channel_url) and upgrades only when that version changes.
          Not supported with rke2_airgapped.

      rke2_channel_url:
        type: str
        required: false
        default: "https://update.rke2.io/v1-release/channels"
        description: >
          Channel index used on the controller to resolve rke2_channel to a
          version.

      rke2_install_method:
        type: str
        required: false
        default: ""
        choices: ["", "rpm", "tar"]
        description: >
          Exported to get.rke2.io as INSTALL_RKE2_METHOD. Empty uses the
          installer default (rpm on yum/dnf hosts, tar elsewhere).

      rke2_agent_token:
        type: str
        required: false
        default: ""
        description: >
          Optional separate token for agent nodes. When set, agents authenticate
          with this token instead of rke2_cluster_token, giving them less cluster
          access than server nodes. A value scoped to server_nodes only is read
          from the first server's host vars for the agents.

      rke2_cluster_token:
        type: str
        required: false
        default: ""
        description: >
          Pre-set cluster token. When empty the role reads the auto-generated
          token from /var/lib/rancher/rke2/server/node-token on the first server
          and distributes it to all other nodes. When set, the first server is
          configured with it as well, and the role fails if it differs from the
          token of an existing cluster.

      rke2_allow_downgrade:
        type: bool
        required: false
        default: false
        description: >
          Allow installing a version older than what is currently installed.
          Set true only when a deliberate rollback is required.

      # -----------------------------------------------------------------------
      # Installation mode
      # -----------------------------------------------------------------------
      rke2_disable_firewalld:
        type: bool
        required: false
        default: true
        description: >
          Stop and disable firewalld before install. Set false to manage
          firewall rules yourself.

      rke2_airgapped:
        type: bool
        required: false
        default: false
        description: >
          Set true for air-gapped environments where outbound internet access
          is blocked.

      rke2_require_artifacts_dir:
        type: bool
        required: false
        default: true
        description: >
          Require rke2_airgapped_artifacts_dir when rke2_airgapped is true.
          Set false for a deliberate partial air-gap.

      rke2_airgapped_artifacts_dir:
        type: str
        required: false
        default: ""
        description: >
          Path on the Ansible controller to a directory containing
          pre-downloaded RKE2 artifacts (rke2-install.sh,
          rke2.linux-<arch>.tar.gz, sha256sum-<arch>.txt, where <arch> is
          rke2_architecture). Leave empty to download only the install script
          from the internet.

      rke2_architecture:
        type: str
        required: false
        description: >
          Architecture suffix of the air-gap artifacts (amd64, arm64). Defaults
          to the node's CPU architecture (x86_64 -> amd64, aarch64 -> arm64).

      rke2_airgapped_additional_image_tarballs:
        type: list
        elements: str
        required: false
        default: []
        description: >
          Extra image tarballs in rke2_airgapped_artifacts_dir to stage for the
          installer, e.g. rke2-images-ingress-nginx.linux-amd64.tar.zst. They
          must be named rke2-images-*.linux-<arch>.tar.zst (or .tar.gz), and
          rke2-images.linux-<arch>.tar.zst must be staged too.

      rke2_system_default_registry:
        type: str
        required: false
        default: ""
        description: >
          Mirror registry for all RKE2 system images (system-default-registry).
          Applied to servers and agents. Empty = upstream registries.

      # -----------------------------------------------------------------------
      # Proxy settings
      # -----------------------------------------------------------------------
      rke2_http_proxy:
        type: str
        required: false
        default: ""
        description: HTTP proxy URL for RKE2 and containerd (e.g. http://proxy.example.com:3128).

      rke2_https_proxy:
        type: str
        required: false
        default: ""
        description: HTTPS proxy URL for RKE2 and containerd.

      rke2_no_proxy:
        type: str
        required: false
        default: ""
        description: Comma-separated list of hosts/CIDRs that bypass the proxy.

      rke2_containerd_http_proxy:
        type: str
        required: false
        default: ""
        description: Override HTTP proxy for containerd only. Independent of rke2_http_proxy; empty means unset.

      rke2_containerd_https_proxy:
        type: str
        required: false
        default: ""
        description: Override HTTPS proxy for containerd only.

      rke2_containerd_no_proxy:
        type: str
        required: false
        default: ""
        description: Override no-proxy list for containerd only.

      # -----------------------------------------------------------------------
      # CNI plugin
      # -----------------------------------------------------------------------
      rke2_cni:
        type: str
        required: false
        default: default
        choices:
          - default
          - canal
          - cilium
          - calico
          - flannel
          - none
        description: >
          CNI plugin. default (canal), canal, cilium, calico, flannel, or none
          (BYO CNI — skips cni config and emits cni: none).

      rke2_cni_configs:
        type: dict
        required: false
        default: {}
        description: >
          CNI-specific configuration dict keyed by CNI name. Only used when
          rke2_cni is not 'default'. Example key: calico with nested Helm values.

      # -----------------------------------------------------------------------
      # VIP / High Availability
      # -----------------------------------------------------------------------
      rke2_vip_enabled:
        type: bool
        required: false
        default: false
        description: >
          Enable a Virtual IP for the control plane. When true, rke2_vip_address
          is automatically added to tls-san.

      rke2_vip_address:
        type: str
        required: false
        default: ""
        description: Virtual IP address (e.g. 10.0.0.100). Required when rke2_vip_enabled is true.

      rke2_vip_interface:
        type: str
        required: false
        default: eth0
        description: Network interface on control-plane nodes used by the VIP.

      rke2_vip_manager:
        type: str
        required: false
        default: kubevip
        choices: ["kubevip", "keepalived"]
        description: >
          VIP manager. Options: kubevip (kube-vip DaemonSet via server/manifests),
          keepalived (this role installs/configures keepalived directly).

      rke2_kubevip_version:
        type: str
        required: false
        default: v1.3.2
        description: kube-vip image tag. Only used when rke2_vip_manager is 'kubevip'.

      rke2_kubevip_image_repository:
        type: str
        required: false
        default: ghcr.io/kube-vip/kube-vip
        description: >
          kube-vip image repository, e.g. an internal mirror for air-gapped
          clusters. The tag is rke2_kubevip_version.

      rke2_kubevip_port:
        type: str
        required: false
        default: "6443"
        description: Control-plane port kube-vip advertises the VIP on.

      rke2_kubevip_svc_enable:
        type: bool
        required: false
        default: false
        description: >
          Enable kube-vip watching of LoadBalancer-type Services (sets svc_enable=true
          in the DaemonSet). Automatically enabled when rke2_kubevip_cloud_provider_enabled
          is true.

      rke2_kubevip_service_election_enable:
        type: bool
        required: false
        default: false
        description: Enable per-service leader election in kube-vip (svc_election).

      rke2_kubevip_metrics_port:
        type: int
        required: false
        default: 0
        description: >
          Port on which kube-vip exposes Prometheus metrics. Set to 0 to disable
          the metrics endpoint.

      rke2_kubevip_cloud_provider_enabled:
        type: bool
        required: false
        default: false
        description: >
          Deploy the kube-vip cloud provider, which assigns IPs from
          rke2_kubevip_load_balancer_ip_range to LoadBalancer-type Services.
          Requires rke2_vip_manager=kubevip.

      rke2_kubevip_cloud_provider_image:
        type: str
        required: false
        default: ghcr.io/kube-vip/kube-vip-cloud-provider:v0.0.13
        description: Image for the kube-vip cloud provider StatefulSet.

      rke2_kubevip_load_balancer_ip_range:
        type: str
        required: false
        default: ""
        description: >
          IP pool for LoadBalancer-type Services. Accepts CIDR notation
          (e.g. 192.168.0.200/29) or a range (e.g. 192.168.0.200-192.168.0.250).
          Required when rke2_kubevip_cloud_provider_enabled is true.

      rke2_agent_server_address:
        type: str
        required: false
        default: ""
        description: >
          Override the server address written into the agent config.yaml 'server' field.
          When empty, defaults to rke2_vip_address (if VIP enabled) or the first
          server node's ansible_host. Set this on cloud SDN environments (e.g. Hetzner
          private networks) where gratuitous-ARP VIPs are not directly routable.

      rke2_server_join_address:
        type: str
        required: false
        default: ""
        description: >
          Fixed registration address (host or IP, port 9345) for additional
          servers and agents, e.g. a load balancer or DNS name. Agents still
          prefer rke2_agent_server_address and the VIP. Empty uses the first
          server's ansible_host.

      rke2_keepalived_router_id:
        type: int
        required: false
        default: 51
        description: VRRP virtual router ID (1-255). Must be unique per VRRP group on the subnet.

      rke2_keepalived_priority_master:
        type: int
        required: false
        default: 101
        description: VRRP priority for the first server node (MASTER state).

      rke2_keepalived_priority_backup:
        type: int
        required: false
        default: 100
        description: VRRP priority for additional server nodes (BACKUP state).

      rke2_keepalived_require_custom_auth_pass:
        type: bool
        required: false
        default: false
        description: >
          Fail when rke2_keepalived_auth_pass is still the role default
          (rke2vip). VRRP PASS auth is cleartext on the wire, so this is
          hygiene only.

      rke2_keepalived_auth_pass:
        type: str
        required: false
        default: rke2vip
        description: VRRP authentication password (max 8 characters).

      rke2_keepalived_failover_enabled:
        type: bool
        required: false
        default: false
        description: >
          Enable cloud floating IP failover via keepalived notify_master hook.
          When true, the role deploys a notify script and env file on each server
          node. The script fires whenever a node transitions to MASTER state.

      rke2_keepalived_failover_script:
        type: str
        required: false
        default: /etc/keepalived/notify-master.sh
        description: >
          Absolute path on target nodes where the notify_master script is deployed.

      rke2_keepalived_failover_script_content:
        type: str
        required: false
        default: ""
        description: >
          Shell script body executed when this node becomes keepalived MASTER.
          The script is deployed with mode 0750 and wired into notify_master.
          It sources the env file (failover.env) from the same directory.

      rke2_keepalived_failover_env:
        type: dict
        required: false
        default: {}
        description: >
          Key/value pairs written to a protected env file (mode 0600) in the
          same directory as the notify script. Use for API tokens and IDs that
          must not be embedded in the script body.

      # -----------------------------------------------------------------------
      # Cluster networking
      # -----------------------------------------------------------------------
      rke2_tls_san:
        type: list
        elements: str
        required: false
        default: []
        description: >
          Additional Subject Alternative Names for the RKE2 API server TLS
          certificate (hostnames or IP addresses). The VIP is added automatically
          when rke2_vip_enabled is true.

      rke2_cluster_domain:
        type: str
        required: false
        default: ""
        description: >
          Cluster domain (e.g. cluster.example.net). Defaults to cluster.local
          when empty.

      rke2_cluster_cidr:
        type: str
        required: false
        default: ""
        description: >
          Pod network CIDR. Defaults to 10.42.0.0/16 when empty (RKE2 default).

      rke2_service_cidr:
        type: str
        required: false
        default: ""
        description: >
          Service network CIDR. Defaults to 10.43.0.0/16 when empty (RKE2 default).

      # -----------------------------------------------------------------------
      # etcd snapshots
      # -----------------------------------------------------------------------
      rke2_etcd_disable_snapshots:
        type: bool
        required: false
        default: false
        description: >
          Disable RKE2's built-in etcd snapshots. Snapshots are ON by default
          in RKE2 (every 12h). Set true to disable them entirely.

      rke2_etcd_snapshot_schedule:
        type: str
        required: false
        default: ""
        description: >
          Cron expression overriding the etcd snapshot schedule
          (e.g. "0 */6 * * *"). Ignored when rke2_etcd_disable_snapshots is true.

      rke2_etcd_snapshot_retention:
        type: int
        required: false
        default: 5
        description: Number of local etcd snapshots to retain.

      rke2_etcd_s3_enabled:
        type: bool
        required: false
        default: false
        description: Enable off-cluster S3-compatible etcd snapshot upload.

      rke2_etcd_s3_endpoint:
        type: str
        required: false
        default: ""
        description: S3 endpoint host (e.g. s3.amazonaws.com or minio.example.com:9000).

      rke2_etcd_s3_bucket:
        type: str
        required: false
        default: ""
        description: S3 bucket name for etcd snapshots.

      rke2_etcd_s3_region:
        type: str
        required: false
        default: ""
        description: S3 region (defaults to us-east-1 in RKE2 when empty).

      rke2_etcd_s3_folder:
        type: str
        required: false
        default: ""
        description: Optional path prefix inside the S3 bucket.

      rke2_etcd_s3_access_key:
        type: str
        required: false
        default: ""
        description: S3 access key. Source from Vault; rendered with no_log.

      rke2_etcd_s3_secret_key:
        type: str
        required: false
        default: ""
        description: S3 secret key. Source from Vault; rendered with no_log.

      rke2_etcd_s3_endpoint_ca:
        type: str
        required: false
        default: ""
        description: >
          Optional CA for a private S3 endpoint: a PEM bundle (written to
          /etc/rancher/rke2/etcd-s3-endpoint-ca.pem, mode 0600, and referenced
          by path), a path to a CA file on the servers, or base64-encoded PEM.

      rke2_etcd_s3_skip_ssl_verify:
        type: bool
        required: false
        default: false
        description: Skip TLS verification of the S3 endpoint (lab/self-signed only).

      # -----------------------------------------------------------------------
      # Data and kubeconfig
      # -----------------------------------------------------------------------
      rke2_data_dir:
        type: str
        required: false
        default: /var/lib/rancher/rke2
        description: >
          RKE2 data directory, rendered as data-dir on servers and agents.
          Custom CA files, the cert rotation script and air-gap images follow
          it. An installed agent whose data is still in
          /var/lib/rancher/rke2/agent fails until the data is moved.

      rke2_node_ip:
        type: str
        required: false
        default: ""
        description: >
          Global node-ip advertised to Kubernetes. Per-node node-ip in
          rke2_server_nodes / rke2_agent_nodes overrides this. Empty = auto-detect.

      rke2_node_external_ip:
        type: str
        required: false
        default: ""
        description: >
          Global node-external-ip. Per-node node-external-ip overrides this.
          Empty = not set.

      rke2_cluster_dns:
        type: str
        required: false
        default: ""
        description: >
          Override the cluster DNS service IP. Must fall inside rke2_service_cidr.
          Empty = RKE2 default.

      rke2_write_kubeconfig_mode:
        type: str
        required: false
        default: "0600"
        description: File mode for the kubeconfig written by RKE2.

      rke2_kubeconfig_download:
        type: bool
        required: false
        default: false
        description: >
          Fetch the kubeconfig to the Ansible controller after install
          (first server node only).

      rke2_kubeconfig_output_path:
        type: str
        required: false
        default: "{{ playbook_dir }}/rke2.yaml"
        description: >
          Local path on the Ansible controller where the kubeconfig is saved.
          Only used when rke2_kubeconfig_download is true.

      rke2_kubeconfig_server:
        type: str
        required: false
        default: ""
        description: >
          API server host name or IP (no scheme or port) written into the
          downloaded kubeconfig. Empty uses rke2_vip_address when the VIP is
          enabled, otherwise the first server's ansible_host or inventory name.

      # -----------------------------------------------------------------------
      # Server nodes
      # -----------------------------------------------------------------------
      rke2_server_nodes:
        type: list
        elements: dict
        required: false
        default: []
        description: >
          Per-server-node labels and taints. Each entry is a dict with a 'host'
          key (matching ansible_host) and optional 'node-label' / 'node-taint'
          lists.

      # -----------------------------------------------------------------------
      # Agent nodes
      # -----------------------------------------------------------------------
      rke2_agent_nodes:
        type: list
        elements: dict
        required: false
        default: []
        description: >
          Per-agent-node labels and taints. Each entry is a dict with a 'host'
          key (matching ansible_host) and optional 'node-label' / 'node-taint'
          lists.

      # -----------------------------------------------------------------------
      # Custom CA certificates
      # -----------------------------------------------------------------------
      rke2_custom_root_ca_cert:
        type: str
        required: false
        default: ""
        description: >
          Base64-encoded PEM custom root CA certificate (pipe raw PEM through
          `| b64encode`). When set together with rke2_custom_root_ca_key, the
          role generates RKE2 cluster certificates signed by this CA on the
          first server node.

      rke2_custom_root_ca_key:
        type: str
        required: false
        default: ""
        description: >
          Base64-encoded PEM private key for the custom root CA certificate
          (pipe raw PEM through `| b64encode`).

      rke2_custom_intermediate_ca_cert:
        type: str
        required: false
        default: ""
        description: >
          Base64-encoded PEM custom intermediate CA certificate (optional;
          pipe raw PEM through `| b64encode`).

      rke2_custom_intermediate_ca_key:
        type: str
        required: false
        default: ""
        description: >
          Base64-encoded PEM private key for the custom intermediate CA
          certificate (pipe raw PEM through `| b64encode`).

      rke2_custom_ca_remove_signing_keys:
        type: bool
        required: false
        default: true
        description: >
          Remove root-ca.key and intermediate-ca.key from nodes after the
          cluster CA chain is generated and verified. Re-supply from Vault if a
          later CA rotation is required.

      # -----------------------------------------------------------------------
      # Certificate rotation
      # -----------------------------------------------------------------------
      rke2_cert_rotation_enabled:
        type: bool
        required: false
        default: false
        description: >
          Enable automated certificate rotation via cron. Rotates when a cert
          expires within rke2_cert_rotation_expiry_threshold_days.

      rke2_cert_rotation_expiry_threshold_days:
        type: int
        required: false
        default: 20
        description: >
          Number of days before expiry at which the rotation cron job triggers
          a rotation.

      rke2_cert_rotation_schedule_type:
        type: str
        required: false
        default: weekly
        choices: ["daily", "weekly", "monthly"]
        description: >
          Cron schedule type for certificate rotation. Options: daily, weekly,
          monthly.

      rke2_cert_rotation_schedule_hour:
        type: str
        required: false
        default: "20"
        description: Hour (0-23) at which the rotation cron job runs.

      rke2_cert_rotation_schedule_minute:
        type: str
        required: false
        default: "0"
        description: Minute (0-59) at which the rotation cron job runs.

      rke2_cert_rotation_schedule_day_of_week:
        type: str
        required: false
        default: "1"
        description: Day of week (1-7, 1=Monday) for weekly rotation schedule.

      rke2_cert_rotation_schedule_day_of_month:
        type: str
        required: false
        default: "1"
        description: Day of month (1-31) for monthly rotation schedule.

      rke2_cert_rotation_log_retention_days:
        type: int
        required: false
        default: 7
        description: Number of days to retain certificate rotation log files.

      rke2_cert_rotation_stagger_minutes:
        type: int
        required: false
        default: 30
        description: >
          Minutes between the rotation jobs of consecutive nodes. Servers run
          in server_nodes order starting at the configured hour and minute,
          agents follow after the last server; the time wraps around midnight.
          0 runs the job on every node at the same time.

      # -----------------------------------------------------------------------
      # Additional packages
      # -----------------------------------------------------------------------
      rke2_additional_packages:
        type: list
        elements: str
        required: false
        default:
          - curl
          - iptables
        description: >
          OS packages to install before RKE2. curl and iptables are required.
          Add extras such as jq or htop here.

      # -----------------------------------------------------------------------
      # Ingress controller
      # -----------------------------------------------------------------------
      rke2_ingress_controller:
        type: str
        required: false
        default: traefik
        choices:
          - traefik
          - ingress-nginx
          - ingress-nginx+traefik
          - none
        description: >
          Bundled ingress controller(s), rendered as the RKE2
          ingress-controller key. traefik (default), ingress-nginx (retired
          upstream, RKE2 < v1.37 only), ingress-nginx+traefik (dual mode for
          migration, nginx stays the default class; also on v1.37), or none.

      rke2_traefik_config:
        type: str
        required: false
        default: ""
        description: >
          YAML string of Helm values for the bundled rke2-traefik chart, applied
          as a HelmChartConfig on the first server node when the controller
          includes traefik.

      rke2_ingress_nginx_config:
        type: str
        required: false
        default: ""
        description: >
          YAML string with Helm values for the rke2-ingress-nginx HelmChart
          config. Applied when the controller includes ingress-nginx.
          Leave empty or comment-only to skip.

      # -----------------------------------------------------------------------
      # Helm addons
      # -----------------------------------------------------------------------
      rke2_addons:
        type: list
        elements: dict
        required: false
        default: []
        description: >
          List of Helm addons to deploy via RKE2 HelmChart CRDs. Each entry
          requires: name, enabled (bool), repo, version, namespace. Optional
          keys: chart (defaults to name), values (dict), set (dict), bootstrap,
          failurePolicy, authSecret, repoCA (PEM certificates; a value without
          BEGIN CERTIFICATE is rendered as repoCAConfigMap) and
          repoCAConfigMap (ConfigMap name).

      rke2_addons_delete_on_disable:
        type: bool
        required: false
        default: false
        description: >
          When true, disabling an addon (enabled: false) also runs
          kubectl delete helmchart <name> -n kube-system, uninstalling the
          running release. Default false only removes the manifest file.

      rke2_helmchartconfigs:
        type: list
        elements: dict
        required: false
        default: []
        description: >
          HelmChartConfig overrides for RKE2 bundled charts. Each entry needs
          name (bundled chart name) and valuesContent (YAML string of Helm
          values). Applied on the first server node in kube-system.

      # -----------------------------------------------------------------------
      # Private registry
      # -----------------------------------------------------------------------
      rke2_private_registries_config:
        type: str
        required: false
        default: ""
        description: >
          YAML string for /etc/rancher/rke2/registries.yaml (mirrors and auth
          config). A change restarts RKE2 on each node, one at a time. Empty or
          comment-only removes a file this role wrote earlier and leaves a file
          managed elsewhere alone.

      # -----------------------------------------------------------------------
      # Built-in component management
      # -----------------------------------------------------------------------
      rke2_disable_kube_proxy:
        type: bool
        required: false
        default: false
        description: >
          Disable kube-proxy entirely. Use when replacing kube-proxy with a CNI
          (e.g. Cilium in kube-proxy replacement mode).

      rke2_disable:
        type: list
        elements: str
        required: false
        default: []
        description: >
          List of built-in RKE2 components to disable (e.g. rke2-ingress-nginx,
          rke2-metrics-server, rke2-coredns).

      # -----------------------------------------------------------------------
      # Kubernetes component arguments
      # -----------------------------------------------------------------------
      rke2_kube_apiserver_args:
        type: list
        elements: str
        required: false
        default: []
        description: Extra flags passed to kube-apiserver (key=value or --flag format).

      rke2_kube_scheduler_args:
        type: list
        elements: str
        required: false
        default: []
        description: Extra flags passed to kube-scheduler.

      rke2_kube_controller_manager_args:
        type: list
        elements: str
        required: false
        default: []
        description: Extra flags passed to kube-controller-manager.

      rke2_kubelet_args:
        type: list
        elements: str
        required: false
        default: []
        description: Extra flags passed to kubelet.

      rke2_kube_proxy_args:
        type: list
        elements: str
        required: false
        default: []
        description: Extra flags passed to kube-proxy. Not rendered when rke2_disable_kube_proxy is true.

      # -----------------------------------------------------------------------
      # Cloud provider
      # -----------------------------------------------------------------------
      rke2_disable_cloud_controller:
        type: bool
        required: false
        default: false
        description: >
          Disable RKE2's built-in cloud controller manager. Only when a real
          external cloud controller manager (e.g. AWS CCM, hcloud CCM)
          initialises the nodes; the kube-vip cloud provider is not one.

      rke2_external_ccm_deployed:
        type: bool
        required: false
        default: false
        description: >
          A third-party cloud controller manager initialises the nodes. Only
          then does the role accept rke2_kubevip_cloud_provider_enabled with
          rke2_disable_cloud_controller true.

      rke2_cloud_provider_name:
        type: str
        required: false
        default: ""
        description: >
          Cloud provider name passed to kubelet and the API server. Set to
          "external" when using any external cloud controller manager.

      # -----------------------------------------------------------------------
      # Rolling restart
      # -----------------------------------------------------------------------
      rke2_drain_node_during_upgrade:
        type: bool
        required: false
        default: false
        description: >
          Cordon and drain each server node before restarting during upgrades.
          Requires the play to use serial: 1.

      rke2_drain_additional_args:
        type: str
        required: false
        default: "--timeout=120s"
        description: Additional arguments passed to kubectl drain.

      rke2_wait_for_all_pods_to_be_ready:
        type: bool
        required: false
        default: false
        description: >
          After uncordoning a node, wait for all pods to reach Running or
          Succeeded phase before proceeding to the next node.

      rke2_drain_force:
        type: bool
        required: false
        default: false
        description: >
          Pass --force to kubectl drain, evicting pods not managed by a
          ReplicaSet/Job/DaemonSet. Off by default.

      # -----------------------------------------------------------------------
      # Restart handlers
      # -----------------------------------------------------------------------
      rke2_handler_wait_for_ready:
        type: bool
        required: false
        default: true
        description: >
          Health-gate the restart handlers. Each server restart (one server at
          a time) waits for https://127.0.0.1:9345/ping and for the node to be
          Ready before the next server restarts; each agent restart waits for
          the kubelet port 10250. Set false only when the nodes cannot answer
          these probes (e.g. render-only test containers).

      rke2_agent_restart_throttle:
        type: int
        required: false
        default: 1
        description: >
          Maximum number of agents restarted at the same time when their
          config or version changes. Servers always restart one at a time.

      # -----------------------------------------------------------------------
      # Hardening
      # -----------------------------------------------------------------------
      rke2_cis_profile:
        type: str
        required: false
        default: ""
        choices: ["", "cis", "etcd"]
        description: >
          RKE2 hardening profile, rendered on servers and agents. cis applies
          the CIS kernel parameters and creates the etcd user; etcd only
          creates the etcd user and group. Leave empty to disable.

      rke2_audit_policy:
        type: str
        required: false
        default: ""
        description: >
          Full YAML body of a Kubernetes audit policy. When set, the role
          deploys /etc/rancher/rke2/audit-policy.yaml (mode 0600) and emits
          audit-policy-file in config.yaml.

      rke2_selinux:
        type: bool
        required: false
        default: false
        description: >
          Set selinux: true in the RKE2 config. On RHEL-family nodes the role
          installs container-selinux automatically.

      # -----------------------------------------------------------------------
      # Runtime options
      # -----------------------------------------------------------------------
      rke2_node_name:
        type: str
        required: false
        default: ""
        description: >
          Override the Kubernetes node name. When empty, servers register with
          their lowercased hostname and agents with their inventory_hostname.

      rke2_debug:
        type: bool
        required: false
        default: false
        description: Enable RKE2 debug logging (very verbose — for troubleshooting only).

      # -----------------------------------------------------------------------
      # Extra configuration
      # -----------------------------------------------------------------------
      rke2_extra_config:
        type: dict
        required: false
        default: {}
        description: >
          Catch-all dict appended to config.yaml on servers and agents for RKE2
          options not exposed by a dedicated variable. Keys the role already
          renders (_rke2_managed_config_keys in vars/main.yml) are rejected.
