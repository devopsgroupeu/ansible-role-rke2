---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check RKE2 binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/rke2
      register: rke2_binary

    - name: Assert RKE2 binary exists
      ansible.builtin.assert:
        that: rke2_binary.stat.exists
        fail_msg: "/usr/local/bin/rke2 binary was not found"

    - name: Check RKE2 version output
      ansible.builtin.command: rke2 --version
      register: rke2_version_check
      changed_when: false

    - name: Assert RKE2 version is correct
      ansible.builtin.assert:
        that: "'v1.36.1+rke2r2' in rke2_version_check.stdout"
        fail_msg: "RKE2 version mismatch: {{ rke2_version_check.stdout }}"

    - name: Check rke2-server service is active
      ansible.builtin.command: systemctl is-active rke2-server # noqa: command-instead-of-module
      register: rke2_service_status
      changed_when: false
      failed_when: false

    - name: Assert rke2-server service is active
      ansible.builtin.assert:
        that: rke2_service_status.stdout == 'active'
        fail_msg: "rke2-server service is not active (status: {{ rke2_service_status.stdout }})"

    - name: Check RKE2 config file exists
      ansible.builtin.stat:
        path: /etc/rancher/rke2/config.yaml
      register: rke2_config

    - name: Assert RKE2 config file exists
      ansible.builtin.assert:
        that: rke2_config.stat.exists
        fail_msg: "/etc/rancher/rke2/config.yaml was not created"

    - name: Read RKE2 config file
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/config.yaml
      register: rke2_config_raw

    - name: Parse RKE2 config as YAML
      ansible.builtin.set_fact:
        rke2_config_parsed: "{{ rke2_config_raw.content | b64decode | from_yaml }}"

    - name: Assert tls-san is a list
      ansible.builtin.assert:
        that: rke2_config_parsed['tls-san'] is iterable
        fail_msg: "tls-san is missing or not a list in config.yaml"

    - name: Assert rke2-server hostname is in tls-san
      ansible.builtin.assert:
        that: "'rke2-server' in rke2_config_parsed['tls-san']"
        fail_msg: "Expected 'rke2-server' in tls-san, got: {{ rke2_config_parsed['tls-san'] }}"

    - name: Assert cluster-domain is set in config
      ansible.builtin.assert:
        that: rke2_config_parsed.get('cluster-domain') == 'cluster.test'
        fail_msg: "cluster-domain not set correctly in config.yaml, got: {{ rke2_config_parsed.get('cluster-domain') }}"

    - name: Assert disable-kube-proxy is absent when false
      ansible.builtin.assert:
        that: "'disable-kube-proxy' not in rke2_config_parsed"
        fail_msg: "disable-kube-proxy should not be present when rke2_disable_kube_proxy is false"

    - name: Check RKE2 kubeconfig exists
      ansible.builtin.stat:
        path: /etc/rancher/rke2/rke2.yaml
      register: rke2_kubeconfig

    - name: Assert RKE2 kubeconfig exists
      ansible.builtin.assert:
        that: rke2_kubeconfig.stat.exists
        fail_msg: "/etc/rancher/rke2/rke2.yaml was not created"

    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: rke2_kubeconfig_raw

    - name: Parse kubeconfig as YAML
      ansible.builtin.set_fact:
        rke2_kubeconfig_parsed: "{{ rke2_kubeconfig_raw.content | b64decode | from_yaml }}"

    - name: Assert kubeconfig has clusters defined
      ansible.builtin.assert:
        that: rke2_kubeconfig_parsed.clusters | length > 0
        fail_msg: "kubeconfig has no clusters defined"

    - name: Assert kubeconfig has contexts defined
      ansible.builtin.assert:
        that: rke2_kubeconfig_parsed.contexts | length > 0
        fail_msg: "kubeconfig has no contexts defined"

    - name: Check kubeconfig exists in user home
      ansible.builtin.stat:
        path: "/root/.kube/config"
      register: kubeconfig_home

    - name: Assert kubeconfig exists in user home
      ansible.builtin.assert:
        that: kubeconfig_home.stat.exists
        fail_msg: "/root/.kube/config was not created"
