---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: rke2-server1
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - server_nodes
    networks:
      - name: rke2-network

  - name: rke2-server2
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - server_nodes
    networks:
      - name: rke2-network

  - name: rke2-server3
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - server_nodes
    networks:
      - name: rke2-network

  - name: rke2-agent1
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    # Differs from the inventory name the agent registers with (node-name),
    # so rolling_restart must not use the hostname for agents.
    hostname: rke2-agent1-host
    groups:
      - agent_nodes
    networks:
      - name: rke2-network

provisioner:
  name: ansible
  playbooks:
    side_effect: side_effect.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    hosts:
      all:
        vars:
          ansible_user: root
          # The version the mock binary reports and converge installs.
          rke2_version: v1.36.6+rke2r2
    group_vars:
      server_nodes:
        # ':' and '#' break unquoted YAML; the templates must quote tokens.
        rke2_agent_token: "0123:#mock-agent-token-ha"

verifier:
  name: ansible
