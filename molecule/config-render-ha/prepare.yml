---
- name: Prepare all nodes
  hosts: all
  gather_facts: true
  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Install required packages
      ansible.builtin.package:
        name:
          - curl
          - iptables
          - python3
          - cron
          - openssl
        state: present

    - name: Create rancher directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/rancher/rke2
        - /var/lib/rancher/rke2/server
        - /var/lib/rancher/rke2/server/manifests
        - /var/lib/rancher/rke2/agent/pod-manifests
        - /var/lib/rancher/rke2/bin
        - /usr/local/bin

    - name: Create self-signed TLS certificate for the mock supervisor
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - /etc/rancher/rke2/mock-tls.key
          - -out
          - /etc/rancher/rke2/mock-tls.crt
          - -subj
          - /CN=rke2-mock
          - -days
          - "30"
        creates: /etc/rancher/rke2/mock-tls.crt

    # The mock services listen like the real ones (supervisor HTTPS /ping on
    # 9345 for servers, kubelet port 10250 for agents), so the health-gated
    # restart handlers run their real waits against them.
    - name: Create mock rke2 listener
      ansible.builtin.copy:
        dest: /usr/local/bin/rke2-mock-listener.py
        mode: "0755"
        content: |
          import http.server
          import socket
          import ssl
          import sys

          class Ping(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"pong")

              def log_message(self, *args):
                  pass

          if sys.argv[1] == "server":
              httpd = http.server.ThreadingHTTPServer(("0.0.0.0", 9345), Ping)
              ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              ctx.load_cert_chain("/etc/rancher/rke2/mock-tls.crt", "/etc/rancher/rke2/mock-tls.key")
              httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
              httpd.serve_forever()
          else:
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("0.0.0.0", 10250))
              s.listen(100)
              while True:
                  conn, _ = s.accept()
                  conn.close()

    - name: Create mock rke2 binary
      ansible.builtin.copy:
        dest: /usr/local/bin/rke2
        mode: "0755"
        content: |
          #!/bin/bash
          case "$1" in
            --version) echo "rke2 version v1.36.1+rke2r2 (abc123)" ;;
            server|agent) exec python3 /usr/local/bin/rke2-mock-listener.py "$1" ;;
          esac

    # Reports the node Ready after one second, so serial restarts are at least
    # one second apart and the verify step can tell them from parallel ones.
    - name: Create mock kubectl
      ansible.builtin.copy:
        dest: /var/lib/rancher/rke2/bin/kubectl
        mode: "0755"
        content: |
          #!/bin/bash
          sleep 1
          echo -n True

    - name: Create mock kubeconfig
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/rke2.yaml
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: https://127.0.0.1:6443
              name: default
          contexts:
            - context:
                cluster: default
                user: default
              name: default
          current-context: default
          users:
            - name: default
              user:
                token: mock-token

    - name: Create mock rke2-server systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/rke2-server.service
        mode: "0644"
        content: |
          [Unit]
          Description=RKE2 Kubernetes Server (mock)

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/rke2 server

          [Install]
          WantedBy=multi-user.target

    - name: Create mock rke2-agent systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/rke2-agent.service
        mode: "0644"
        content: |
          [Unit]
          Description=RKE2 Kubernetes Agent (mock)

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/rke2 agent

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      ansible.builtin.command: systemctl daemon-reload # noqa: command-instead-of-module
      changed_when: false

- name: Prepare server nodes only
  hosts: server_nodes
  gather_facts: false
  tasks:
    - name: Create mock node token on all server nodes
      ansible.builtin.copy:
        dest: /var/lib/rancher/rke2/server/node-token
        content: "mock-cluster-token-for-ha-testing"
        mode: "0600"

    - name: Create the existing cluster token on the first server (matches the preset)
      ansible.builtin.copy:
        dest: /var/lib/rancher/rke2/server/token
        content: "K10mockcahash::server:preset-token-ha"
        mode: "0600"
      when: inventory_hostname == groups['server_nodes'][0]

    - name: Enable and start mock rke2-server service
      ansible.builtin.command: systemctl enable --now rke2-server # noqa: command-instead-of-module
      changed_when: false

    - name: Wait for mock port 9345 to be ready
      ansible.builtin.wait_for:
        port: 9345
        timeout: 15
      when: inventory_hostname == groups['server_nodes'][0]

- name: Prepare agent nodes only
  hosts: agent_nodes
  gather_facts: false
  tasks:
    - name: Enable and start mock rke2-agent service
      ansible.builtin.command: systemctl enable --now rke2-agent # noqa: command-instead-of-module
      changed_when: false
