---
- name: Prepare
  hosts: all
  gather_facts: true
  vars:
    # get.rke2.io installs the RPM (binary in /usr/bin) on yum/dnf hosts and
    # the tarball (/usr/local/bin) elsewhere; the mock sits where the real
    # binary would.
    _mock_rke2_bin: "{{ '/usr/bin/rke2' if ansible_facts['os_family'] == 'RedHat' else '/usr/local/bin/rke2' }}"
  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install required packages
      ansible.builtin.package:
        name: "{{ _packages[ansible_facts['os_family']] | default(_packages['Debian']) }}"
        state: present
      vars:
        # EL images ship curl-minimal, which conflicts with the curl package;
        # the SELinux packages are present on real EL hosts, not in the image.
        _packages:
          # No cron: the role installs it when certificate rotation is on.
          Debian: [curl, iptables, python3, openssl]
          RedHat: [iptables, python3, python3-libselinux, selinux-policy-targeted, openssl]

    - name: Create rancher directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/rancher/rke2
        - /etc/default
        - /etc/sysctl.d
        # converge.yml sets rke2_data_dir: /data/rke2
        - /data/rke2/server
        - /data/rke2/server/manifests
        - /usr/local/bin

    - name: Create mock rke2 binary
      ansible.builtin.copy:
        dest: "{{ _mock_rke2_bin }}"
        mode: "0755"
        content: |
          #!/bin/bash
          if [[ "$1" == "--version" ]]; then
            echo "rke2 version {{ rke2_version }} (abc123)"
          fi

    - name: Create mock node token
      ansible.builtin.copy:
        dest: /data/rke2/server/node-token
        content: "mock-cluster-token-for-testing"
        mode: "0600"

    - name: Create mock kubeconfig
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/rke2.yaml
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: https://127.0.0.1:6443
              name: default
          contexts:
            - context:
                cluster: default
                user: default
              name: default
          current-context: default
          users:
            - name: default
              user:
                token: mock-token

    - name: Create mock rke2-server systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/rke2-server.service
        mode: "0644"
        content: |
          [Unit]
          Description=RKE2 Kubernetes Server (mock)

          [Service]
          Type=oneshot
          ExecStart={{ _mock_rke2_bin }} server
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

- name: Generate throwaway root CA for config-render tests
  hosts: all
  gather_facts: false
  tasks:
    - name: Generate self-signed root CA key and certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - "{{ playbook_dir }}/test-root-ca.key"
          - -out
          - "{{ playbook_dir }}/test-root-ca.pem"
          - -subj
          - /CN=rke2-test-ca
          - -days
          - "3650"
        creates: "{{ playbook_dir }}/test-root-ca.pem"
      delegate_to: localhost
      run_once: true # noqa: run-once
      become: false

    - name: Restrict permissions on root CA private key
      ansible.builtin.file:
        path: "{{ playbook_dir }}/test-root-ca.key"
        mode: "0600"
      delegate_to: localhost
      run_once: true # noqa: run-once
      become: false
