---
- name: Verify rendered config
  hosts: server_nodes
  gather_facts: false
  tasks:
    - name: Read rke2-server proxy env file
      ansible.builtin.slurp:
        src: /etc/default/rke2-server
      register: proxy_env_raw

    - name: Assert proxy env uses UPPERCASE keys
      ansible.builtin.assert:
        that:
          - "'HTTP_PROXY=' in (proxy_env_raw.content | b64decode)"
          - "'HTTPS_PROXY=' in (proxy_env_raw.content | b64decode)"
          - "'NO_PROXY=' in (proxy_env_raw.content | b64decode)"
          - "'CONTAINERD_HTTP_PROXY=' in (proxy_env_raw.content | b64decode)"
          - "'CONTAINERD_HTTPS_PROXY=' in (proxy_env_raw.content | b64decode)"
          - "'CONTAINERD_NO_PROXY=' in (proxy_env_raw.content | b64decode)"
        fail_msg: "proxy env file does not contain UPPERCASE proxy keys (including CONTAINERD_* variants)"

    - name: Read CNI HelmChartConfig manifest
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/manifests/rke2-calico-config.yml
      register: cni_raw

    - name: Parse CNI manifest as YAML
      ansible.builtin.set_fact:
        cni_parsed: "{{ cni_raw.content | b64decode | from_yaml }}"

    - name: Assert CNI manifest names rke2-calico and renders values
      ansible.builtin.assert:
        that:
          - cni_parsed.metadata.name == 'rke2-calico'
          - "'mtu: 9000' in cni_parsed.spec.valuesContent"
        fail_msg: "cni-config did not render rke2_cni_configs correctly"

    - name: Read RKE2 server config
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/config.yaml
      register: server_config_raw

    - name: Parse server config as YAML
      ansible.builtin.set_fact:
        server_config_parsed: "{{ server_config_raw.content | b64decode | from_yaml }}"

    - name: Assert valid etcd snapshot schedule key is present
      ansible.builtin.assert:
        that:
          - "'etcd-snapshot-schedule-cron' in server_config_parsed"
          - server_config_parsed['etcd-snapshot-schedule-cron'] == '0 */6 * * *'
          - "'etcd-snapshot' not in server_config_parsed"
          - "'etcd-snapshot-schedule' not in server_config_parsed"
        fail_msg: "config.yaml does not use valid etcd-snapshot-schedule-cron key"

    - name: Assert etcd S3 keys render
      ansible.builtin.assert:
        that:
          - server_config_parsed['etcd-s3'] | bool
          - server_config_parsed['etcd-s3-bucket'] == 'rke2-backups'
          - server_config_parsed['etcd-s3-access-key'] == 'AKIAEXAMPLE'
          - server_config_parsed['etcd-snapshot-retention'] == 10
        fail_msg: "etcd S3 / retention keys not rendered in config.yaml"

    - name: Read kube-vip RBAC manifest
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/manifests/kube-vip-rbac.yml
      register: rbac_raw

    - name: Assert kube-vip RBAC grants endpointslices
      ansible.builtin.assert:
        that: "'endpointslices' in (rbac_raw.content | b64decode)"
        fail_msg: "kube-vip RBAC missing discovery.k8s.io/endpointslices"

    - name: Check etcd user exists
      ansible.builtin.command: id etcd
      register: etcd_user_check
      changed_when: false
      failed_when: false

    - name: Assert etcd system user was created for CIS
      ansible.builtin.assert:
        that: etcd_user_check.rc == 0
        fail_msg: "etcd system user not created despite rke2_cis_profile set"

    - name: Stat CIS sysctl drop-in
      ansible.builtin.stat:
        path: /etc/sysctl.d/60-rke2-cis.conf
      register: cis_sysctl

    - name: Assert CIS sysctl drop-in deployed
      ansible.builtin.assert:
        that: cis_sysctl.stat.exists
        fail_msg: "/etc/sysctl.d/60-rke2-cis.conf not deployed for CIS profile"

    - name: Read kube-vip DaemonSet manifest
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/manifests/kube-vip.yml
      register: kubevip_ds_raw

    - name: Assert kube-vip image is v1.x
      ansible.builtin.assert:
        that: "'kube-vip:v1.' in (kubevip_ds_raw.content | b64decode)"
        fail_msg: "kube-vip DaemonSet not pinned to a v1.x image"

    - name: Assert kube-vip DaemonSet sets port and vip_subnet
      ansible.builtin.assert:
        that:
          - "'name: port' in (kubevip_ds_raw.content | b64decode)"
          - "'name: vip_subnet' in (kubevip_ds_raw.content | b64decode)"
        fail_msg: "kube-vip DaemonSet missing port / vip_subnet env vars"

    - name: Stat rke2 config.yaml
      ansible.builtin.stat:
        path: /etc/rancher/rke2/config.yaml
      register: cfg_stat

    - name: Assert config.yaml is mode 0600
      ansible.builtin.assert:
        that: cfg_stat.stat.mode == '0600'
        fail_msg: "config.yaml mode is {{ cfg_stat.stat.mode }}, expected 0600 (holds join token)"

    - name: Stat root CA private key after generation
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2/server/tls/root-ca.key
      register: rootca_key

    - name: Assert root CA private key was removed
      ansible.builtin.assert:
        that: not rootca_key.stat.exists
        fail_msg: "root-ca.key was left on the node despite remove_signing_keys=true"

    - name: Stat audit policy file
      ansible.builtin.stat:
        path: /etc/rancher/rke2/audit-policy.yaml
      register: audit_policy_stat

    - name: Assert audit policy deployed 0600 and referenced
      ansible.builtin.assert:
        that:
          - audit_policy_stat.stat.exists
          - audit_policy_stat.stat.mode == '0600'
          - server_config_parsed['audit-policy-file'] == '/etc/rancher/rke2/audit-policy.yaml'
        fail_msg: "audit policy file not deployed/referenced correctly"

    # --- E3: data_dir parametrisation ---
    - name: Stat CNI manifest using rke2_data_dir path (E3)
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2/server/manifests/rke2-calico-config.yml
      register: e3_cni_stat

    - name: Assert CNI manifest exists at rke2_data_dir-derived path (E3)
      ansible.builtin.assert:
        that: e3_cni_stat.stat.exists
        fail_msg: "CNI manifest not found at rke2_data_dir/server/manifests (E3 data_dir fix)"

    - name: Stat kube-vip RBAC manifest using rke2_data_dir path (E3)
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2/server/manifests/kube-vip-rbac.yml
      register: e3_rbac_stat

    - name: Assert kube-vip RBAC manifest exists at rke2_data_dir-derived path (E3)
      ansible.builtin.assert:
        that: e3_rbac_stat.stat.exists
        fail_msg: "kube-vip RBAC manifest not found at rke2_data_dir/server/manifests (E3 data_dir fix)"

    # --- E5: node-ip / node-external-ip ---
    - name: Assert node-ip renders in server config when rke2_node_ip is set (E5)
      ansible.builtin.assert:
        that:
          - server_config_parsed['node-ip'] == '192.168.10.5'
          - server_config_parsed['node-external-ip'] == '203.0.113.5'
        fail_msg: "node-ip / node-external-ip not rendered in config.yaml (E5)"

    # --- E6: system-default-registry ---
    - name: Assert system-default-registry renders in server config when set (E6)
      ansible.builtin.assert:
        that:
          - server_config_parsed['system-default-registry'] == 'registry.example.com:5000'
        fail_msg: "system-default-registry not rendered in config.yaml (E6)"

    # --- E7: cluster-dns override ---
    - name: Assert cluster-dns renders in server config when set (E7)
      ansible.builtin.assert:
        that:
          - server_config_parsed['cluster-dns'] == '10.43.0.10'
        fail_msg: "cluster-dns not rendered in config.yaml (E7)"

    # --- E9: ingress controller selector (traefik default) ---
    - name: Read Traefik HelmChartConfig manifest (E9)
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/manifests/rke2-traefik-config.yml
      register: traefik_cfg_raw

    - name: Assert Traefik HelmChartConfig renders name and valuesContent (E9)
      ansible.builtin.assert:
        that:
          - "'rke2-traefik' in (traefik_cfg_raw.content | b64decode)"
          - "'service' in (traefik_cfg_raw.content | b64decode)"
        fail_msg: "Traefik HelmChartConfig not rendered at rke2-traefik-config.yml (E9)"

    - name: Assert rke2-ingress-nginx is disabled in server config (E9 traefik disables nginx)
      ansible.builtin.assert:
        that:
          - "'rke2-ingress-nginx' in server_config_parsed.get('disable', [])"
        fail_msg: "rke2-ingress-nginx not in disable list when controller=traefik (E9)"

    # --- E11: addon CRD fields (bootstrap/set/repoCA/authSecret/failurePolicy) ---
    - name: Read rendered argocd addon manifest (E11)
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/manifests/addon-argocd.yml
      register: addon_argocd_raw

    - name: Assert addon CRD fields render (E11)
      ansible.builtin.assert:
        that:
          - "'bootstrap: true' in (addon_argocd_raw.content | b64decode)"
          - "'failurePolicy: reinstall' in (addon_argocd_raw.content | b64decode)"
          - "'repoCA: harbor-ca' in (addon_argocd_raw.content | b64decode)"
          - "'name: nexus-pull' in (addon_argocd_raw.content | b64decode)"
          - "'server.replicas' in (addon_argocd_raw.content | b64decode)"
        fail_msg: "Addon CRD fields (bootstrap/failurePolicy/repoCA/authSecret/set) not rendered (E11)"

    # --- E12: rke2_helmchartconfigs ---
    - name: Read HelmChartConfig override manifest for rke2-coredns (E12)
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/manifests/helmchartconfig-rke2-coredns.yml
      register: hcc_coredns_raw

    - name: Assert HelmChartConfig override renders name and valuesContent (E12)
      ansible.builtin.assert:
        that:
          - "'rke2-coredns' in (hcc_coredns_raw.content | b64decode)"
          - "'replicas: 2' in (hcc_coredns_raw.content | b64decode)"
        fail_msg: "HelmChartConfig override for rke2-coredns not rendered (E12)"

    # --- Folded from default scenario: binary, service, kubeconfig, cluster-domain ---

    - name: Check rke2-server service is active
      ansible.builtin.command: systemctl is-active rke2-server # noqa: command-instead-of-module
      register: rke2_service_status
      changed_when: false
      failed_when: false

    - name: Assert rke2-server service is active
      ansible.builtin.assert:
        that: rke2_service_status.stdout == 'active'
        fail_msg: "rke2-server service is not active (status: {{ rke2_service_status.stdout }})"

    - name: Check RKE2 version output
      ansible.builtin.command: rke2 --version
      register: rke2_version_check
      changed_when: false

    - name: Assert RKE2 version matches rke2_version
      ansible.builtin.assert:
        that: "'v1.36.1+rke2r2' in rke2_version_check.stdout"
        fail_msg: "RKE2 version mismatch: {{ rke2_version_check.stdout }}"

    - name: Check kubeconfig exists in user home
      ansible.builtin.stat:
        path: "/root/.kube/config"
      register: kubeconfig_home

    - name: Assert kubeconfig exists in user home
      ansible.builtin.assert:
        that: kubeconfig_home.stat.exists
        fail_msg: "/root/.kube/config was not created"

    - name: Parse kubeconfig from /etc/rancher/rke2/rke2.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: rke2_kubeconfig_raw

    - name: Parse kubeconfig as YAML
      ansible.builtin.set_fact:
        rke2_kubeconfig_parsed: "{{ rke2_kubeconfig_raw.content | b64decode | from_yaml }}"

    - name: Assert kubeconfig has clusters defined
      ansible.builtin.assert:
        that: rke2_kubeconfig_parsed.clusters | length > 0
        fail_msg: "kubeconfig has no clusters defined"

    - name: Assert kubeconfig has contexts defined
      ansible.builtin.assert:
        that: rke2_kubeconfig_parsed.contexts | length > 0
        fail_msg: "kubeconfig has no contexts defined"

    - name: Assert cluster-domain is set in config
      ansible.builtin.assert:
        that: server_config_parsed.get('cluster-domain') == 'cluster.test'
        fail_msg: "cluster-domain not set correctly in config.yaml, got: {{ server_config_parsed.get('cluster-domain') }}"

    - name: Assert disable-kube-proxy is absent when false
      ansible.builtin.assert:
        that: "'disable-kube-proxy' not in server_config_parsed"
        fail_msg: "disable-kube-proxy should not be present when rke2_disable_kube_proxy is false"
