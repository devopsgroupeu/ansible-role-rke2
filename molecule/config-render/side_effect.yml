---
# Channel mode on an already installed node: rke2_version empty, rke2_channel
# set. The channel index comes from a mock served on the controller's
# 127.0.0.1 and reports the version the mock binary prints, so the run must
# succeed without installing or restarting anything.
- name: Serve a mock RKE2 channel index on the controller
  hosts: localhost
  gather_facts: false
  vars:
    _channel_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rke2-channels"
  tasks:
    - name: Create the mock channel directory
      ansible.builtin.file:
        path: "{{ _channel_dir }}"
        state: directory
        mode: "0700"

    - name: Write the mock channel index
      ansible.builtin.copy:
        dest: "{{ _channel_dir }}/channels.json"
        mode: "0600"
        content: |
          {"data": [{"id": "latest", "latest": "v1.99.0+rke2r1"},
                    {"id": "stable", "latest": "v1.36.1+rke2r2"}]}

    # Serves for at most 10 minutes, so it cannot outlive a failed run.
    - name: Start the mock channel server on 127.0.0.1:18345
      ansible.builtin.shell: |
        nohup python3 -c '
        import functools, http.server, sys, time
        handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=sys.argv[1])
        server = http.server.HTTPServer(("127.0.0.1", 18345), handler)
        server.timeout = 1
        deadline = time.time() + 600
        while time.time() < deadline:
            server.handle_request()
        ' "{{ _channel_dir }}" >/dev/null 2>&1 &
        echo $! > "{{ _channel_dir }}/server.pid"
      changed_when: true

    - name: Wait for the mock channel server
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 18345
        timeout: 15

- name: Record the node state before the channel-mode run
  hosts: server_nodes
  gather_facts: false
  tasks:
    - name: Read rke2-server start time before
      ansible.builtin.command: systemctl show rke2-server -p ActiveEnterTimestampMonotonic --value # noqa: command-instead-of-module
      register: _started_before
      changed_when: false

- name: Converge in channel mode
  ansible.builtin.import_playbook: converge.yml
  vars:
    rke2_version: ""
    rke2_channel: stable
    rke2_channel_url: "http://127.0.0.1:18345/channels.json"

- name: Check the channel-mode run
  hosts: server_nodes
  gather_facts: false
  tasks:
    - name: Read rke2-server start time after
      ansible.builtin.command: systemctl show rke2-server -p ActiveEnterTimestampMonotonic --value # noqa: command-instead-of-module
      register: _started_after
      changed_when: false

    - name: Assert channel mode resolved the version and changed nothing
      ansible.builtin.assert:
        that:
          - _rke2_target_version == 'v1.36.1+rke2r2'
          - not (_rke2_install_needed | bool)
          - _started_after.stdout == _started_before.stdout
        fail_msg: >-
          channel mode resolved {{ _rke2_target_version }} (install needed:
          {{ _rke2_install_needed }}) or restarted rke2-server

- name: Stop the mock channel server
  hosts: localhost
  gather_facts: false
  vars:
    _channel_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rke2-channels"
  tasks:
    - name: Stop the mock channel server
      ansible.builtin.shell: kill "$(cat '{{ _channel_dir }}/server.pid')" || true
      changed_when: true

- name: Reject standalone ingress-nginx on an RKE2 v1.37 target
  hosts: server_nodes
  gather_facts: false
  tasks:
    - name: Run the version and server checks with ingress-nginx and v1.37
      block:
        - name: Include the version tasks
          ansible.builtin.include_role:
            name: ansible-role-rke2
            tasks_from: version.yml
          vars:
            rke2_version: v1.37.2+rke2r1

        - name: Include the server tasks
          ansible.builtin.include_role:
            name: ansible-role-rke2
            tasks_from: server.yml
          vars:
            rke2_version: v1.37.2+rke2r1
            rke2_ingress_controller: ingress-nginx

        - name: Fail when the guard did not fire
          ansible.builtin.fail:
            msg: ingress-nginx with a v1.37 target was not rejected
      rescue:
        - name: Assert the ingress guard fired and points to dual mode
          ansible.builtin.assert:
            that: ansible_failed_result.msg is search('ingress-nginx[+]traefik')
            fail_msg: "unexpected failure: {{ ansible_failed_result.msg }}"
