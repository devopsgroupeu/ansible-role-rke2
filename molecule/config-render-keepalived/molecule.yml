---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: rke2-server1
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - server_nodes
    networks:
      - name: keepalived-network

  - name: rke2-server2
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - server_nodes
    networks:
      - name: keepalived-network

  - name: rke2-server3
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - server_nodes
    networks:
      - name: keepalived-network

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    hosts:
      all:
        vars:
          ansible_user: root
          # The version the mock binary reports and converge installs.
          rke2_version: v1.36.6+rke2r2
    host_vars:
      rke2-server1:
        private_ip: 192.0.2.11

verifier:
  name: ansible
